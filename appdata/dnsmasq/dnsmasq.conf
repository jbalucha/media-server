# Local DNS for the media server stack.
# Point your router's DHCP DNS (or individual devices) at the media server
# host (192.168.1.245) and every *.minipc.arpa name resolves locally.

# Upstream resolvers for everything that is not local
no-resolv
server=1.1.1.1
server=9.9.9.9

# Never forward plain (dot-less) names or private-range reverse lookups
domain-needed
bogus-priv

# Primary domain (matches LOCAL_DOMAIN in .env): a public DuckDNS record
# that points at the PRIVATE IP 192.168.1.245, so every LAN device resolves
# it through whatever DNS it already uses - no router changes needed.
# This local entry makes it resolve even when the internet is down, for
# devices that use this dnsmasq directly.
address=/minipc-ms.duckdns.org/192.168.1.245

# Offline/legacy fallback domain (only resolvable via this dnsmasq)
address=/minipc.arpa/192.168.1.245

cache-size=1000
