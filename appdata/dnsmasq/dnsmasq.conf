# Local DNS for the media server stack.
# Point your router's DHCP DNS (or individual devices) at the media server
# host (192.168.1.245) and every *.minipc.arpa name resolves locally.

# Upstream resolvers for everything that is not local
no-resolv
server=1.1.1.1
server=9.9.9.9

# Never forward plain (dot-less) names or private-range reverse lookups
domain-needed
bogus-priv

# Wildcard: minipc.arpa and every *.minipc.arpa resolve to the media server.
# .arpa never resolves on the public internet, so devices not using this DNS
# just fail to resolve these names - no risk of landing on a real website.
# (The RFC 8375 standard name would be home.arpa; minipc.arpa works the same
# on a LAN.) Keep this line in sync with LOCAL_DOMAIN in .env.
address=/minipc.arpa/192.168.1.245

cache-size=1000
