# Local DNS for the media server stack.
# Point your router's DHCP DNS (or individual devices) at the media server
# host (192.168.1.245) and every *.minipc.com name resolves locally.

# Upstream resolvers for everything that is not local
no-resolv
server=1.1.1.1
server=9.9.9.9

# Never forward plain (dot-less) names or private-range reverse lookups
domain-needed
bogus-priv

# Wildcard: minipc.com and every *.minipc.com resolve to the media server.
# NOTE: minipc.com is a registered public domain. While this DNS server is
# in use, LAN clients cannot reach the real minipc.com website. If that ever
# matters, switch to a domain you own or to home.arpa (RFC 8375) - update
# LOCAL_DOMAIN in .env and this line to match.
address=/minipc.com/192.168.1.245

cache-size=1000
