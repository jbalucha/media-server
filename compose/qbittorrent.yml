services:
  # qBittorrent - Torrent downloader (ALL traffic through the PIA VPN)
  # Shares gluetun's network namespace: no own networks/ports/labels here.
  # Other containers reach the WebUI at http://gluetun:8080.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    profiles: ["apps", "downloads", "all"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - $DOCKERDIR/appdata/qbittorrent:/config
      - $DOWNLOADSDIR:/data/downloads # Ensure that downloads folder is set to /data/downloads in qBittorrent
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      # QB_WEBUI_PORT: $QBITTORRENT_PORT
      UMASK: 002
