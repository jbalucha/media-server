services:
  # Tailscale - Remote access VPN (subnet router)
  # Advertises the LAN ($LOCAL_IPS) into the tailnet so remote devices can
  # reach 192.168.1.x - all the *.$LOCAL_DOMAIN URLs then work from anywhere.
  #
  # One-time host prerequisites (need sudo):
  #   printf 'net.ipv4.ip_forward = 1\nnet.ipv6.conf.all.forwarding = 1\n' | \
  #     sudo tee /etc/sysctl.d/99-tailscale.conf && sudo sysctl -p /etc/sysctl.d/99-tailscale.conf
  # After first start: authenticate (TS_AUTHKEY in .env, or the login URL
  # from `docker logs tailscale`), then approve the subnet route and disable
  # key expiry for this machine in the Tailscale admin console.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: minipc # machine name in the tailnet
    restart: unless-stopped
    profiles: ["core", "all"]
    network_mode: host # tailscale0 lives in the host netns - full-speed kernel mode
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_ROUTES=${LOCAL_IPS:-192.168.1.0/24}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--accept-dns=false # don't let MagicDNS manage this node's DNS
    volumes:
      - ${DOCKERDIR}/appdata/tailscale:/var/lib/tailscale
