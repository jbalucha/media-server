services:
  # Gluetun - PIA VPN tunnel + kill switch for qBittorrent.
  # qBittorrent runs inside this container's network namespace, so ALL its
  # traffic goes through the VPN (firewall blocks everything if the tunnel
  # drops). Publishes qBittorrent's WebUI port and carries its Traefik route.
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    profiles: ["apps", "downloads", "all"]
    networks:
      - default
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "$QBITTORRENT_PORT:8080" # qBittorrent WebUI (runs in this netns)
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - OPENVPN_USER=${PIA_USERNAME:-}
      - OPENVPN_PASSWORD=${PIA_PASSWORD:-}
      - SERVER_REGIONS=${PIA_REGION:-Netherlands}
      # PIA port forwarding (needed for incoming peers, else speeds collapse).
      # port-sync.sh pushes the assigned port into qBittorrent on every
      # (re)connect, because PIA hands out a different one each time.
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh /gluetun/port-sync.sh {{PORTS}}
      - QBT_USER=${QBITTORRENT_USERNAME:-}
      - QBT_PASS=${QBITTORRENT_PASSWORD:-}
      # Plain DNS through the tunnel. Gluetun's default DNS-over-TLS proxy
      # kept timing out against Cloudflare, which broke tracker lookups (slow
      # downloads) and failed the healthcheck - and an unhealthy container
      # makes Traefik drop the qbittorrent route entirely.
      - DOT=off
      - DNS_ADDRESS=1.1.1.1
      # Refresh PIA's server list daily; a stale list breaks port forwarding
      # ("API IP address not found") after PIA rotates its endpoints.
      - UPDATER_PERIOD=24h
      - TZ=$TZ
    volumes:
      - $DOCKERDIR/appdata/gluetun:/gluetun
    labels:
      - traefik.enable=true
      # qBittorrent's route lives here because its WebUI answers in this netns
      - traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${LOCAL_DOMAIN}`)
      - traefik.http.routers.qbittorrent.entrypoints=web
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8080
