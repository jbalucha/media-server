services:
  # File Browser - Explorer
  # Uses its own embedded database in /config (it has no Postgres support).
  filebrowser:
    image: filebrowser/filebrowser:s6
    container_name: filebrowser
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    profiles: ["apps", "all"]
    networks:
      - default
    ports:
      - "$FILEBROWSER_PORT:80"
    volumes:
      - $DOCKERDIR/appdata/filebrowser:/config
      # user database - without this mount every recreate wipes all logins
      - $DOCKERDIR/appdata/filebrowser/database:/database
      - $USERDIR:/data/
    environment:
      - TZ=$TZ
      - PUID=$PUID
      - PGID=$PGID
    labels:
      - traefik.enable=true
      - traefik.http.routers.filebrowser.rule=Host(`files.${LOCAL_DOMAIN}`)
      - traefik.http.routers.filebrowser.entrypoints=web
      - traefik.http.services.filebrowser.loadbalancer.server.port=80
