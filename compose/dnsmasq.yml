services:
  # Dnsmasq - Local DNS server
  # Resolves $LOCAL_DOMAIN and all its subdomains to this host, forwards
  # everything else upstream. Point your router's DHCP DNS (or individual
  # devices) at this host's IP to use it LAN-wide.
  dnsmasq:
    image: dockurr/dnsmasq:latest
    container_name: dnsmasq
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    profiles: ["core", "all"]
    networks:
      - default
    ports:
      # Bind to the LAN IP only - 0.0.0.0:53 would collide with
      # systemd-resolved's stub listener on 127.0.0.53
      - "$HOST_IP:53:53/udp"
      - "$HOST_IP:53:53/tcp"
    volumes:
      - $DOCKERDIR/appdata/dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
